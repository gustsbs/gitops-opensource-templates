apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-multisite-html
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: wordpress
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: portal-multisite-prod-html-pv
  resources:
    requests:
      storage: 20Gi
