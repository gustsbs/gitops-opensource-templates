# WordPress multisite em subdiretorios na nginx-wordpress.
# Incluido DENTRO do bloco server (/etc/nginx/wordpress.d/*.conf), antes das
# locations da imagem; montado pelo overlay via ConfigMap.

# /<subsite>/wp-admin -> /<subsite>/wp-admin/
rewrite ^/([_0-9a-zA-Z-]+/)?wp-admin$ /$1wp-admin/ permanent;

# Subsites: /<subsite>/wp-(admin|includes|content)/... e /<subsite>/*.php
# sao os arquivos da raiz (o WordPress identifica o subsite pelo REQUEST_URI).
if (!-e $request_filename) {
    rewrite ^/[_0-9a-zA-Z-]+(/wp-(admin|includes|content)/.*)$ $1 last;
    rewrite ^/[_0-9a-zA-Z-]+(/[^/]+\.php)$ $1 last;
}
