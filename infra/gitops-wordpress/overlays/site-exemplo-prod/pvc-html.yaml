apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-exemplo-html
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: wordpress
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: site-exemplo-prod-html-pv
  resources:
    requests:
      storage: 20Gi
