apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - deployment-redis.yaml
  - service-redis.yaml
  - networkpolicy-redis.yaml

# Versao unica para todos os sites: trocar aqui atualiza o parque inteiro.
images:
  - name: registry.exemplo.edu.br/dev/wordpress/php-wordpress
    newTag: 8.5.12-v1.0
  - name: registry.exemplo.edu.br/dev/wordpress/nginx-wordpress
    newTag: 1.30.6-v1.0
  - name: registry.exemplo.edu.br/dev/wordpress/redis-wordpress
    newTag: 8.8.3-v1.0

labels:
  - pairs:
      app.kubernetes.io/part-of: wordpress
    includeSelectors: true
