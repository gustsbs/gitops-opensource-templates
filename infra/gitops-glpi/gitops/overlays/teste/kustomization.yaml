apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glpi-teste

resources:
  - ../../base
  - ingress.yaml
  - sealed-config_db.yaml
  - sealed-glpicrypt.yaml
  - sealed-oauth.yaml

patches:
  - target:
      kind: Deployment
      name: glpi
    path: patch-deployment.yaml
  - target:
      kind: CronJob
      name: glpi-cron
    path: patch-cronjob.yaml

images:
  - name: registry.exemplo.edu.br/dev/glpi/php-glpi
    newTag: 11.0.11-v1.1-build-23
  - name: registry.exemplo.edu.br/dev/glpi/nginx-glpi
    newTag: 11.0.11-v1.1-build-23
