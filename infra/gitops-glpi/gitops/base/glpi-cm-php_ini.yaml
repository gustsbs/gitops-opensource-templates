apiVersion: v1
kind: ConfigMap
metadata:
  name: glpi-php-config
data:
  php-custom.ini: |-
    opcache.enable=1
    opcache.enable_cli=1
    opcache.save_comments=1
    memory_limit = 4G
    opcache.memory_consumption = 512M
    opcache.interned_strings_buffer=32
    opcache.max_accelerated_files=20000

    session.save_handler = redis
    session.save_path = "tcp://glpi-redis:6379"

    upload_max_filesize = 100M
    post_max_size = 100M
    disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority
    session.cookie_httponly=On
    session.gc_maxlifetime = 28800
    session.cookie_lifetime = 28800

    [mail function]
    sendmail_path = "/usr/bin/msmtp --host smtp.exemplo.edu.br --port 25 -f naoresponda@exemplo.edu.br -t"
  # Lido depois do php-custom.ini (ordem alfabetica em conf.custom).
  # Acesso sempre por HTTPS (TLS termina antes do cluster).
  zz-session.ini: |-
    session.cookie_secure = On
    session.cookie_samesite = Lax
