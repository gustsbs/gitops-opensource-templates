; Pool do GLPI na imagem php-glpi (PHP-FPM sem root). Montado como
; php-fpm.d/zz-glpi.conf. Sem user/group: o processo ja roda como UID 33.
; Dimensione max_children pelo limits.memory do container.
[www]
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 300
