name: Validar templates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.4.3
      KUBECONFORM_VERSION: 0.6.7
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kustomize e kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform

      - name: Renderizar e validar os manifestos
        run: bash ferramentas/validar-manifestos.sh

      - name: Verificar anonimizacao
        env:
          # Termos da instituicao de origem, guardados como variavel do
          # repositorio (Settings > Secrets and variables > Actions > Variables).
          ANON_PATTERNS: ${{ vars.ANON_PATTERNS }}
        run: bash ferramentas/verificar-anonimizacao.sh

      - name: Verificar scripts shell
        run: shellcheck -S warning $(git ls-files '*.sh')
