# Perfil WordPress: codigo (core, plugins, temas, uploads) no volume do site,
# atualizado pelo wp-admin. Ativado pela imagem nginx-wordpress.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    # Mesmo limite do proxy-body-size do Ingress e do upload_max_filesize
    # da php-wordpress.
    client_max_body_size 250m;

    # IP real do cliente (realip.conf) e ajustes por site (ex.: multisite),
    # montados por ConfigMap no overlay.
    include /etc/nginx/wordpress.d/*.conf;

    # Liveness: responde so o nginx, sem depender do PHP (evita reinicio
    # em cascata quando o banco ou o php-fpm estao lentos).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness: verifica o php-fpm (ping.path em zz-health.conf).
    location = /fpm-ping {
        access_log off;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_NAME     /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Permalinks do WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # wp-config.php nunca deve ser servido
    location = /wp-config.php {
        deny all;
    }

    # XML-RPC: vetor comum de forca bruta; reabrir por site so se necessario.
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }

    # Arquivos ocultos (.git, .env, .htaccess...), exceto .well-known (ACME)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Regex sao avaliados na ordem: bloqueios ANTES do bloco generico de PHP.

    # PHP dentro de uploads (mitigacao contra webshell via plugin vulneravel)
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Extensoes que um WordPress nao usa (varreduras e spam indexado)
    location ~* \.(shtml|asp|aspx|jsp|cgi)$ {
        return 410;
    }

    # Listagem de diretorios em wp-content (sondagem de plugins/temas)
    location ~ ^/wp-content/.*/$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|css|js|ico|svg|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~* \.(pdf|docx?|xlsx?|pptx?|odt|ods|zip)$ {
        try_files $uri =404;
        expires 30d;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
