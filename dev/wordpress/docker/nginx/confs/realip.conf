# IP real do cliente: confie SOMENTE na faixa de pods onde roda o ingress
# controller (ajuste para o CIDR de pods do seu cluster). O ingress-nginx
# repassa o IP do cliente em X-Original-Forwarded-For quando ha um
# balanceador externo antes dele. Nunca use uma faixa ampla aqui, senao
# qualquer cliente forja o cabecalho.
set_real_ip_from 10.244.0.0/16;
real_ip_header   X-Original-Forwarded-For;
real_ip_recursive off;
