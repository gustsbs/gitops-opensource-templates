; Pool para um site WordPress tipico, dimensionado para o limits.memory do
; container (max_children x memoria media por processo < limits.memory).
; Sites com mais acesso: aumentar replicas no overlay antes de mexer aqui.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
request_terminate_timeout = 300s
