# Origens autorizadas a usar as APIs do GLPI, avaliadas sobre o IP REAL do
# cliente (exige o realip configurado). Substitua pelas redes da instituicao.
allow 10.0.0.0/8;          # redes privadas, VPN e datacenter
allow 172.16.0.0/12;
allow 192.168.0.0/16;
# allow 203.0.113.0/24;    # exemplo: bloco publico da instituicao
deny  all;
