worker_processes auto;
# /tmp: unico local gravavel com readOnlyRootFilesystem (emptyDir)
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;

    gzip on;
    gzip_types text/css application/javascript application/json
               image/svg+xml font/woff2;
    gzip_min_length 256;

    # Limite de tentativas no login local, por IP real do cliente
    # (depende do realip: sem ele, todos teriam o IP do ingress).
    limit_req_zone $binary_remote_addr zone=glpi_login:10m rate=10r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
