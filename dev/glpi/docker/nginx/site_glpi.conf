# GLPI >= 10.0.7: root em public/ e somente index.php vai para o PHP-FPM
# (https://glpi-install.readthedocs.io/en/latest/prerequisites.html).
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100m;

    # IP real do cliente: vem por ConfigMap do GitOps, porque depende da rede
    # do cluster. Sem o arquivo, o nginx segue com o IP do ingress.
    include /etc/nginx/glpi.d/realip*.conf;

    # Cabecalhos de seguranca (HSTS fica onde termina o TLS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness: responde so o nginx, sem depender do PHP.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness: verifica o php-fpm (ping.path em zz-health.conf).
    location = /fpm-ping {
        access_log off;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_NAME     /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Sistema interno: fora dos buscadores.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Login local: limite de 10 tentativas/min por IP (rajada de 10).
    location = /front/login.php {
        limit_req zone=glpi_login burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # APIs do GLPI (v1 apirest.php e v2 api.php): so redes autorizadas.
    location ~ ^/(apirest|api)\.php(/|$) {
        include /etc/nginx/glpi.d/api-allow.conf;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        # O index.php existe no container php (o nginx so tem public/)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SERVER_NAME $host;

        # TLS termina antes do cluster e aqui chega HTTP. Informa o PHP para o
        # GLPI 11 aceitar session.cookie_secure=On e montar URLs https://
        # sem confiar em cabecalhos X-Forwarded-*.
        fastcgi_param HTTPS          on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT    443;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Arquivos ocultos (.git, .env...), exceto .well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
