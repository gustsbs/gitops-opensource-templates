; Padroes do GLPI embutidos na imagem. O ConfigMap glpi-php-config
; (PHP_INI_SCAN_DIR=:/usr/local/etc/php/conf.custom) e lido depois e
; sobrescreve o que for definido por ambiente.
memory_limit=1G
upload_max_filesize=100M
post_max_size=100M
max_execution_time=300
session.cookie_httponly=On
session.upload_progress.enabled=0
expose_php=Off
