# Cache puro (object cache do WordPress, cache do GLPI): nunca fonte de
# verdade. Sem persistencia em disco; a evicao pode apagar qualquer chave.
save ""
appendonly no

# Ajuste conforme o limits.memory do container.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Isolamento feito pela NetworkPolicy do namespace (obrigatoria), nao por senha.
protected-mode no
bind 0.0.0.0
